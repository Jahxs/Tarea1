services:
  # ==============================================================================
  # PostgreSQL 16 Database Service
  # ==============================================================================
  db:
    image: postgres:16-alpine
    container_name: postgres-crud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crud_tareas_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crud_tareas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crud-network

  # ==============================================================================
  # Spring Boot 3 Full-Stack Application Service
  # ==============================================================================
  app:
    build:
      context: ./proyecto-1
      dockerfile: Dockerfile
    container_name: springboot-crud-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-crud_tareas_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - crud-network

  # ==============================================================================
  # Nginx Reverse Proxy Service (Port 80)
  # ==============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - crud-network


# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: postgres_crud_data

# ==============================================================================
# Internal Networks
# ==============================================================================
networks:
  crud-network:
    name: crud_network
