# ==============================================================================
# TaskHub Nginx Reverse Proxy Configuration (Port 80)
# Reverse proxy routing for Spring Boot 3 full-stack service on internal port 8080
# ==============================================================================

upstream springboot_backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Maximum payload size for JSON request bodies
    client_max_body_size 10M;

    # Common reverse proxy headers forwarded to Spring Boot
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Host $host;

    # Upstream connectivity and read timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # REST API endpoints for CRUD operations (/api/tareas and /api/tareas/{id})
    # Preserves HTTP methods (GET, POST, PUT, DELETE), request body, and query strings
    location /api/tareas {
        proxy_pass http://springboot_backend;
    }

    # Frontend single-page interface, static resources, and root path (/, /index.html)
    location / {
        proxy_pass http://springboot_backend;
    }
}
