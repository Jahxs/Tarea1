# Nombre de la aplicación
spring.application.name=crud-tareas

# Puerto del servidor embebido
server.port=${SERVER_PORT:8080}

# Configuración de conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crud_tareas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
# update: crea o actualiza las tablas en la BD automáticamente basándose en las entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
